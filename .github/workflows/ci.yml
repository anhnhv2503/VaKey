name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VaKey.sln

      - name: Build
        run: dotnet build VaKey.sln -c Release --no-restore

      - name: Test (with coverage)
        run: dotnet test VaKey.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx

      - name: Check Core coverage >= 85%
        shell: pwsh
        run: |
          # Lấy độ phủ VaKey.Core cao nhất trong các báo cáo (báo cáo của VaKey.Core.Tests).
          $file = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml |
            ForEach-Object { [xml](Get-Content $_.FullName) } |
            ForEach-Object { $_.coverage.packages.package } |
            Where-Object name -eq 'VaKey.Core' |
            Sort-Object { [double]$_.'line-rate' } -Descending | Select-Object -First 1
          $rate = [double]$file.'line-rate'
          "VaKey.Core line coverage: {0:P1}" -f $rate
          if ($rate -lt 0.85) { throw "Core coverage below 85%" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  package:
    needs: build-test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish portable zip + setup.exe
        shell: pwsh
        run: ./build/publish.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - uses: actions/upload-artifact@v4
        with:
          name: vakey-release
          path: artifacts/*
